<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Player</title>
      <style>
            body {
                  margin: 0;
                  padding: 0;
                  box-sizing: border-box;
                  width: 100%;
                  height: 100vh;
                  min-height: 100%;
                  --width: 100%;
                  --height: 100%;
            }
            .container {
                  display: grid;
                  place-content: center;
                  height: var(--height);
                  width: var(--width);
                  background-color: transparent;
                  position: relative;
            }
            .player {
                  width: var(--width);
                  height: var(--height);
                  overflow: hidden;
                  overflow-y: hidden;
                  position: absolute;
                  top: 50%;
                  transform: translateY(-50%);
            }
            iframe {
                  border: none;
            }
      </style>
</head>
<body>
      <div class="container">
            <div class="player">
                  <iframe src="https://inspeccionesserrano.github.io/players/navidad/" width="100%" height="100%" ></iframe>
            </div>
      </div>
</body>
</html>
